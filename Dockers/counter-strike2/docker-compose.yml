services:
  cs2:
    image: cm2network/cs2
    container_name: cs2-server
    restart: unless-stopped

    environment:
      STEAMAPPID: 730
      SRCDS_TOKEN: "D49634E35375242ADAFD709205A55278"

      CS2_SERVERNAME: "Hexagonal Server"
      CS2_RCON_PASSWORD: "rconpassword"
      CS2_PASSWORD: ""
      CS2_PORT: 27015
      CS2_TV_PORT: 27020
      CS2_MAXPLAYERS: 12
      CS2_MAP: "de_mirage"
      CS2_LAN: 0

    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
      - "27020:27020/udp"

    volumes:
      - ./data:/home/steam/cs2-dedicated

    tty: true
    stdin_open: true
